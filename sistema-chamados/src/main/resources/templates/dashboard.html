<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container-fluid py-4 px-4">
    <h4 class="mb-3"><i class="bi bi-bar-chart"></i> Indicadores operacionais</h4>

    <!-- Status -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4 col-xl-2" th:each="e : ${porStatus}">
            <a class="text-decoration-none" th:href="@{/chamados/todos(status=${e.key})}">
                <div class="card p-3 text-center border-top border-4" th:classappend="'border-' + ${e.key.cor}">
                    <div class="text-muted small" th:text="${e.key.descricao}"></div>
                    <div class="kpi text-body" th:text="${e.value}">0</div>
                </div>
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6>Por prioridade</h6>
                <div th:each="e : ${porPrioridade}" class="mb-2">
                    <div class="d-flex justify-content-between small">
                        <span th:text="${e.key.descricao}"></span><b th:text="${e.value}"></b></div>
                    <div class="progress" style="height: 8px">
                        <div class="progress-bar" th:classappend="'bg-' + ${e.key.cor}"
                             th:style="'width:' + (${total == 0 ? 0 : e.value * 100 / total}) + '%'"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6>Por nível de atendimento (nível atual)</h6>
                <table class="table table-sm mb-0">
                    <tr th:each="e : ${porNivel}">
                        <td><a th:href="@{/chamados/todos(grupo=${e.key})}" th:text="${e.key}"></a></td>
                        <td class="text-end"><b th:text="${e.value}"></b></td></tr>
                </table>
                <h6 class="mt-3">Por tipo</h6>
                <table class="table table-sm mb-0">
                    <tr th:each="e : ${porTipo}"><td th:text="${e.key.descricao}"></td><td class="text-end"><b th:text="${e.value}"></b></td></tr>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h6>Por categoria</h6>
                <table class="table table-sm mb-0">
                    <tr th:each="e : ${porCategoria}"><td th:text="${e.key}"></td><td class="text-end"><b th:text="${e.value}"></b></td></tr>
                </table>
            </div>
        </div>
        <div class="col-12">
            <div class="card p-3">
                <h6>Desempenho do suporte (SLA)</h6>
                <div class="row">
                    <div class="col-md-4 col-lg-2 mb-2" th:each="e : ${indicadores}">
                        <div class="small text-muted" th:text="${e.key}"></div>
                        <div class="fs-5 fw-bold" th:text="${e.value}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
