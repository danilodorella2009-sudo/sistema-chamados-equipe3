spring.application.name=sistema-chamados
server.port=8080

# ---------- MySQL ----------
# O banco "chamados_db" é criado automaticamente se não existir.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chamados_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Inicialização do banco ----------
# As tabelas são criadas pelo schema.sql (DDL) e populadas pelo data.sql (DML/seed).
# "always" = recria o banco com os dados de demonstração a cada inicialização.
# Para manter os dados entre execuções, rode com DB_INIT=never após a primeira subida.
spring.sql.init.mode=${DB_INIT:always}
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Regras da aplicação ----------
# Escalonamento automático N1 -> N2 quando o SLA vence (verificação a cada 5 min)
app.escalonamento-automatico.habilitado=true
app.escalonamento-automatico.intervalo-ms=300000

# Logout automático após X segundos sem interação do usuário (mouse, teclado, rolagem, toque)
app.inatividade.segundos=20

# Cálculo de encaminhamento na abertura (Incidente/Bug): pontos = impacto + urgência (2 a 8)
# A partir de quantos pontos o chamado entra direto no N2 / N3 (9 = nunca)
app.encaminhamento.pontos-n2=7
app.encaminhamento.pontos-n3=9

# Horário de funcionamento para abertura de chamados
app.horario.inicio=07:00
app.horario.fim=20:00
# Relógio simulado para testes/apresentação (vazio = horário real). Ex.: app.horario.simulado=21:00
# Também pode ser alterado com o sistema rodando: login do supervisor > menu "Horário de atendimento".
app.horario.simulado=

# Alerta de prazo: avisa quando o chamado pendente já consumiu este percentual do SLA (75 = faltam 25%)
app.sla.alerta-percentual=75
# Verificação de SLA vencido (alerta para todos os técnicos N1/N2/N3 e supervisor), em ms
app.sla.verificacao-vencimento-ms=60000
